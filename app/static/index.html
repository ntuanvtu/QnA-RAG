<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Q&A</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #eff6ff;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --fallback: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .8rem 1rem;
    background: var(--primary);
    color: #fff;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  header .model {
    font-size: .75rem;
    background: rgba(255, 255, 255, .18);
    padding: .15rem .5rem;
    border-radius: 999px;
  }
  header .spacer { flex: 1; }
  header button {
    font: inherit;
    font-size: .8rem;
    color: #fff;
    background: rgba(255, 255, 255, .15);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 8px;
    padding: .35rem .7rem;
    cursor: pointer;
  }
  header button:hover { background: rgba(255, 255, 255, .28); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .9rem;
  }
  .wrap { max-width: 780px; margin: 0 auto; width: 100%; }

  .empty {
    color: var(--muted);
    text-align: center;
    margin: auto;
    max-width: 460px;
    padding: 0 1rem;
    line-height: 1.7;
  }
  .empty b { color: var(--text); }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 80%;
    padding: .7rem .9rem;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user .bubble {
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bot .bubble.fallback { border-left: 3px solid var(--fallback); }

  .meta {
    margin-top: .4rem;
    font-size: .75rem;
    color: var(--muted);
  }
  .meta .src { color: var(--primary-dark); }

  .note {
    align-self: center;
    font-size: .78rem;
    color: var(--muted);
    background: var(--primary-soft);
    border: 1px solid var(--border);
    padding: .3rem .7rem;
    border-radius: 999px;
  }

  .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    margin: 0 2px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  form {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: .7rem 1rem;
  }
  .composer {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: .5rem;
  }
  .composer button, .composer .attach {
    flex: none;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
  }
  .attach {
    width: 40px;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .attach:hover { background: var(--primary-soft); color: var(--primary); }
  .attach.has-file { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    padding: .55rem .7rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

  .send {
    padding: 0 1.1rem;
    background: var(--primary);
    color: #fff;
    border: none;
    font-weight: 600;
  }
  .send:hover { background: var(--primary-dark); }
  .send:disabled { background: #93c5fd; cursor: default; }

  .chip {
    max-width: 780px;
    margin: 0 auto .45rem;
    display: none;
    align-items: center;
    gap: .4rem;
    font-size: .8rem;
    color: var(--primary-dark);
  }
  .chip.show { display: flex; }
  .chip button {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
  }

  .scope {
    max-width: 780px;
    margin: 0 auto .5rem;
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .8rem;
    color: var(--muted);
  }
  .scope select {
    font: inherit;
    font-size: .8rem;
    padding: .25rem .4rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    max-width: 50%;
  }
  .scope .sumfull {
    display: flex;
    align-items: center;
    gap: .3rem;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>Technical Document Q&amp;A</h1>
  <span class="model" id="model"></span>
  <span class="spacer"></span>
  <button id="reset" type="button">Xóa tài liệu</button>
</header>

<div id="messages">
  <div class="empty" id="empty">
    <b>Hỏi bất kỳ điều gì về tài liệu của bạn.</b><br />
    Đính kèm một file PDF bằng nút 📎 rồi gửi câu hỏi — hệ thống tự nạp tài liệu khi bạn gửi.
  </div>
</div>

<form id="form">
  <div class="scope">
    <span>Phạm vi:</span>
    <select id="scope"><option value="">Tất cả tài liệu</option></select>
    <label class="sumfull"><input type="checkbox" id="sumfull" /> Tóm tắt cả tài liệu</label>
  </div>
  <div class="chip" id="chip">
    <span>📄</span><span id="chip-name"></span>
    <button type="button" id="chip-remove" title="Bỏ file">×</button>
  </div>
  <div class="composer">
    <label class="attach" id="attach" title="Đính kèm PDF">
      📎
      <input type="file" id="file" accept="application/pdf" hidden />
    </label>
    <textarea id="q" rows="1" placeholder="Nhập câu hỏi…" required></textarea>
    <button type="submit" class="send" id="send">Gửi</button>
  </div>
</form>

<script>
  const messages = document.getElementById("messages");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const fileInput = document.getElementById("file");
  const attach = document.getElementById("attach");
  const chip = document.getElementById("chip");
  const chipName = document.getElementById("chip-name");
  const scopeSelect = document.getElementById("scope");
  const sumfull = document.getElementById("sumfull");

  const SUMMARY_RE = /tóm tắt|tóm lược|summar|mục lục|khái quát|tổng quan|tổng quát|overview|nội dung chính|ý chính|liệt kê (toàn bộ|tất cả|hết)|toàn bộ (tài liệu|nội dung)|cả (tài liệu|file|quyển|cuốn)/i;

  fetch("/api/info").then(r => r.json())
    .then(d => { document.getElementById("model").textContent = d.model; })
    .catch(() => {});

  async function refreshFiles() {
    try {
      const list = await (await fetch("/api/files")).json();
      const cur = scopeSelect.value;
      scopeSelect.innerHTML = '<option value="">Tất cả tài liệu</option>';
      for (const f of list) {
        const o = document.createElement("option");
        o.value = f.source;
        o.textContent = f.source + " (" + f.n_chunks + " đoạn)";
        scopeSelect.appendChild(o);
      }
      if ([...scopeSelect.options].some(o => o.value === cur)) scopeSelect.value = cur;
    } catch (e) { /* để nguyên "Tất cả tài liệu" */ }
  }
  refreshFiles();

  const scroll = () => { messages.scrollTop = messages.scrollHeight; };

  function addRow(who, build) {
    empty.remove?.();
    const row = document.createElement("div");
    row.className = "row " + who + " wrap";
    build(row);
    messages.appendChild(row);
    scroll();
    return row;
  }

  function addBubble(who, text, cls) {
    return addRow(who, row => {
      const b = document.createElement("div");
      b.className = "bubble" + (cls ? " " + cls : "");
      b.textContent = text;
      row.appendChild(b);
    });
  }

  function addNote(text) {
    empty.remove?.();
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = text;
    messages.appendChild(n);
    scroll();
  }

  function addTyping() {
    return addRow("bot", row => {
      const b = document.createElement("div");
      b.className = "bubble";
      b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      row.appendChild(b);
    });
  }

  // --- đính kèm file ---
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (f) {
      chipName.textContent = f.name;
      chip.classList.add("show");
      attach.classList.add("has-file");
    }
  });
  document.getElementById("chip-remove").addEventListener("click", clearFile);
  function clearFile() {
    fileInput.value = "";
    chip.classList.remove("show");
    attach.classList.remove("has-file");
  }

  // --- textarea auto-grow + Enter để gửi ---
  q.addEventListener("input", () => {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, 140) + "px";
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // --- gửi ---
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = q.value.trim();
    const file = fileInput.files[0];
    if (!text && !file) return;

    const wantSummary = sumfull.checked || SUMMARY_RE.test(text);

    if (file) addNote("📄 Đang nạp " + file.name + "…");
    if (text) addBubble("user", text);

    const data = new FormData();
    data.append("question", text);
    if (scopeSelect.value) data.append("source", scopeSelect.value);
    if (sumfull.checked) data.append("summarize", "1");
    if (file) data.append("file", file);

    q.value = "";
    q.style.height = "auto";
    clearFile();
    send.disabled = true;
    if (wantSummary) addNote("📝 Đang tóm tắt toàn bộ tài liệu — có thể mất 30–90 giây…");
    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", { method: "POST", body: data });
      const d = await res.json();
      typing.remove();

      if (d.ingested) { addNote("✅ " + d.ingested); refreshFiles(); }
      if (d.error) { addBubble("bot", "⚠️ " + d.error, "fallback"); return; }
      if (d.answer == null) return;

      const row = addBubble("bot", d.answer, d.is_fallback ? "fallback" : "");
      const meta = [];
      if (d.sources && d.sources.length) meta.push('<span class="src">Nguồn: ' + d.sources.map(esc).join("; ") + "</span>");
      if (!wantSummary) meta.push("Confidence " + d.confidence.toFixed(2));
      meta.push(d.latency_s.toFixed(1) + "s");
      if (d.search_query && d.search_query.toLowerCase() !== text.toLowerCase())
        meta.push("tìm với: " + esc(d.search_query));
      const m = document.createElement("div");
      m.className = "meta";
      m.innerHTML = meta.join(" · ");
      row.appendChild(m);
      scroll();
    } catch (err) {
      typing.remove();
      addBubble("bot", "⚠️ Lỗi kết nối tới server.", "fallback");
    } finally {
      send.disabled = false;
      q.focus();
    }
  });

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // --- xóa tài liệu ---
  document.getElementById("reset").addEventListener("click", async () => {
    if (!confirm("Xóa toàn bộ tài liệu đã nạp khỏi hệ thống?")) return;
    await fetch("/api/reset", { method: "POST" });
    addNote("🗑️ Đã xóa toàn bộ tài liệu.");
    refreshFiles();
  });
</script>
</body>
</html>
