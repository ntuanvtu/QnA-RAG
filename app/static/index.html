<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Q&A</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --primary-soft: #eff6ff;
    --primary-soft-2: #dbeafe;
    --bg: #f3f7ff;
    --panel: rgba(255,255,255,0.9);
    --surface: #ffffff;
    --surface-strong: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #dfe7f5;
    --fallback: #d97706;
    --fallback-soft: #fff7ed;
    --shadow: 0 16px 40px rgba(37, 99, 235, 0.09);
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: Inter, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(96, 165, 250, 0.15), transparent 28%),
      linear-gradient(180deg, #edf4ff 0%, var(--bg) 100%);
  }

  .app-shell {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 340px;
    min-height: 100vh;
    gap: 0;
  }

  .sidebar {
    background: rgba(15, 23, 42, 0.96);
    color: #e2e8f0;
    padding: 1.25rem .9rem;
    border-right: 1px solid rgba(148, 163, 184, 0.18);
  }

  .sidebar-header {
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #94a3b8;
    padding: .3rem .5rem .9rem;
  }

  .sidebar-list {
    display: flex;
    flex-direction: column;
    gap: .45rem;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .72rem .8rem;
    border-radius: 12px;
    color: #dbeafe;
    background: rgba(148, 163, 184, 0.04);
  }

  .sidebar-item.active {
    background: rgba(59, 130, 246, 0.18);
    color: #fff;
    border: 1px solid rgba(96, 165, 250, 0.2);
  }

  .sidebar-stat {
    margin-top: 1.4rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 14px;
    padding: .8rem .7rem;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    margin-top: .7rem;
    padding: .35rem .62rem;
    border-radius: 999px;
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.2);
    color: #bbf7d0;
    font-size: .72rem;
    font-weight: 600;
  }
  .status-chip::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
  }

  .mini-label {
    display: block;
    font-size: .68rem;
    color: #94a3b8;
    margin-bottom: .38rem;
  }

  .sidebar-stat strong {
    font-size: 1.5rem;
    color: #fff;
  }

  .chat-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  header {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .9rem 1.2rem;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
    color: #fff;
    box-shadow: 0 8px 24px rgba(29, 78, 216, 0.22);
  }
  header h1 {
    font-size: 1.08rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: .01em;
  }
  header .model {
    font-size: .73rem;
    font-weight: 600;
    background: rgba(255,255,255,0.18);
    padding: .18rem .62rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
  }
  header .spacer { flex: 1; }
  header button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 10px;
    padding: .42rem .8rem;
    font: inherit;
    font-size: .8rem;
    cursor: pointer;
    transition: all .2s ease;
  }
  header button:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-1px);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .9rem;
  }
  .wrap { max-width: 820px; margin: 0 auto; width: 100%; }

  .empty {
    margin: auto;
    max-width: 520px;
    padding: 1.3rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: rgba(255,255,255,0.68);
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }
  .empty b { color: var(--text); }

  .row {
    display: flex;
    width: 100%;
  }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .row.answer-row { margin-top: .15rem; }

  .bubble {
    max-width: min(82%, 760px);
    padding: .82rem 1rem;
    border-radius: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
  }
  .user .bubble {
    background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
    color: #fff;
    border-bottom-right-radius: 8px;
  }
  .bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 8px;
  }
  .bot .bubble.fallback {
    border-left: 4px solid var(--fallback);
    background: var(--fallback-soft);
  }
  .bot .bubble.status {
    display: inline-flex;
    align-items: center;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .meta {
    margin-top: .42rem;
    margin-left: .15rem;
    font-size: .74rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: .3rem .55rem;
    align-items: center;
  }
  .meta .src { color: var(--primary-strong); }
  .meta-badge {
    display: inline-flex;
    align-items: center;
    padding: .22rem .5rem;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-strong);
    border: 1px solid rgba(37, 99, 235, 0.12);
    font-weight: 600;
  }
  .meta-badge.warning {
    background: var(--fallback-soft);
    color: var(--fallback);
    border-color: rgba(217, 119, 6, 0.15);
  }

  .answer-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: min(82%, 760px);
  }
  .answer-toggle {
    align-self: flex-start;
    margin-top: .35rem;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary-strong);
    border-radius: 999px;
    padding: .32rem .65rem;
    font-size: .72rem;
    cursor: pointer;
  }
  .answer-collapsed {
    max-height: 180px;
    overflow: hidden;
    position: relative;
  }
  .answer-collapsed::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 52px;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.9));
    pointer-events: none;
  }
  .answer-collapsed.expanded {
    max-height: none;
  }
  .answer-collapsed.expanded::after {
    display: none;
  }

  .source-list {
    margin-top: .42rem;
    display: flex;
    flex-wrap: wrap;
    gap: .45rem;
    max-width: 760px;
  }
  .source-pill {
    display: inline-flex;
    align-items: center;
    padding: .38rem .62rem;
    border-radius: 999px;
    font-size: .72rem;
    background: var(--primary-soft-2);
    color: var(--primary-strong);
    border: 1px solid rgba(37, 99, 235, 0.12);
  }

  .note {
    align-self: center;
    font-size: .75rem;
    color: var(--primary-strong);
    background: rgba(219, 234, 254, 0.85);
    border: 1px solid rgba(59, 130, 246, 0.2);
    padding: .38rem .72rem;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.08);
  }

  .dots span {
    display: inline-block;
    width: 7px; height: 7px;
    margin: 0 2px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    position: sticky;
    bottom: 0;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: .75rem 1rem 1rem;
    box-shadow: 0 -14px 20px rgba(15, 23, 42, 0.03);
  }

  textarea:focus-visible,
  button:focus-visible,
  select:focus-visible,
  .attach:focus-within {
    outline: 3px solid rgba(37, 99, 235, 0.2);
    outline-offset: 2px;
  }
  .composer {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: .6rem;
  }
  .composer button, .composer .attach {
    flex: none;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }
  .attach {
    width: 42px;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    background: var(--surface-strong);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all .2s ease;
  }
  .attach:hover {
    background: var(--primary-soft);
    color: var(--primary);
  }
  .attach.has-file {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
  }

  textarea {
    flex: 1;
    resize: none;
    width: 100%;
    font: inherit;
    padding: .72rem .82rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    max-height: 140px;
    line-height: 1.5;
    background: var(--surface);
    color: var(--text);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  textarea:focus {
    outline: none;
    border-color: rgba(37, 99, 235, 0.55);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
  }

  .send {
    padding: 0 1.15rem;
    background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
    color: white;
    border: none;
    font-weight: 700;
    letter-spacing: .01em;
    box-shadow: 0 12px 18px rgba(37, 99, 235, 0.18);
    transition: transform .2s ease, filter .2s ease;
  }
  .send:hover {
    transform: translateY(-1px);
    filter: brightness(1.02);
  }
  .send:disabled {
    background: linear-gradient(135deg, #93c5fd 0%, #bfdbfe 100%);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }

  .chip {
    max-width: 820px;
    margin: 0 auto .55rem;
    display: none;
    align-items: center;
    gap: .5rem;
    padding: .38rem .6rem;
    border-radius: 999px;
    font-size: .78rem;
    color: var(--primary-strong);
    background: var(--primary-soft);
    border: 1px solid rgba(37,99,235,0.12);
    width: fit-content;
  }
  .chip.show { display: flex; }
  .chip button {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
  }

  .scope {
    max-width: 820px;
    margin: 0 auto .55rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .8rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .scope select {
    font: inherit;
    font-size: .8rem;
    padding: .36rem .5rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    min-width: 180px;
    max-width: 100%;
  }
  .scope .sumfull {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .scope input[type="checkbox"] {
    accent-color: var(--primary);
  }

  .detail-panel {
    background: rgba(248, 250, 252, 0.96);
    border-left: 1px solid var(--border);
    padding: 1rem .85rem;
    min-width: 0;
    transition: width .2s ease, padding .2s ease, opacity .2s ease;
  }
  .detail-panel.collapsed {
    width: 72px;
    padding-left: .55rem;
    padding-right: .55rem;
  }
  .detail-panel.collapsed .panel-body,
  .detail-panel.collapsed .panel-title {
    display: none;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-bottom: .75rem;
  }
  .panel-title {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--primary-strong);
  }
  .panel-toggle {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--primary-strong);
    cursor: pointer;
    font-weight: 700;
  }
  .panel-empty {
    color: var(--muted);
    font-size: .8rem;
    line-height: 1.5;
    padding: .35rem 0;
  }
  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: .7rem .7rem .6rem;
    margin-bottom: .7rem;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.02);
  }
  .source-card-head {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: .5rem;
  }
  .source-badge {
    display: inline-flex;
    width: 24px;
    height: 24px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-strong);
    font-size: .7rem;
    font-weight: 700;
  }
  .source-card-head strong {
    font-size: .78rem;
    word-break: break-word;
  }
  .source-card-body p {
    margin: 0;
    font-size: .76rem;
    color: var(--text);
    line-height: 1.55;
  }
  .source-label {
    font-size: .64rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .3rem;
  }
  .source-card-foot {
    font-size: .7rem;
    color: var(--muted);
    margin-top: .55rem;
  }

  @media (max-width: 980px) {
    .app-shell {
      grid-template-columns: 1fr;
    }
    .sidebar {
      border-right: none;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
    .detail-panel {
      border-left: none;
      border-top: 1px solid var(--border);
      min-height: 220px;
    }
  }

  @media (max-width: 680px) {
    header {
      padding: .8rem .9rem;
      gap: .4rem;
    }
    header h1 { font-size: .96rem; }
    header .model { display: none; }
    .bubble { max-width: 90%; }
    .composer { gap: .45rem; }
    .scope { font-size: .76rem; }
    .scope select { min-width: 140px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">Workspace</div>
      <div class="sidebar-list">
        <div class="sidebar-item active"><span>📚</span> Tài liệu</div>
        <div class="sidebar-item"><span>💬</span> Chat</div>
      </div>
      <div class="sidebar-stat">
        <span class="mini-label">Tài liệu đã nạp</span>
        <strong id="doc-count">0</strong>
        <div id="status-chip" class="status-chip">System ready</div>
      </div>
    </aside>

    <main class="chat-column">
      <header>
        <h1>Technical Document Q&amp;A</h1>
        <span class="model" id="model"></span>
        <span class="spacer"></span>
        <button id="reset" type="button">Xóa tài liệu</button>
      </header>

      <div id="messages" aria-live="polite" aria-atomic="false">
        <div class="empty" id="empty">
          <b>Hỏi bất kỳ điều gì về tài liệu của bạn.</b><br />
          Đính kèm một file PDF bằng nút 📎 rồi gửi câu hỏi — hệ thống tự nạp tài liệu khi bạn gửi.
        </div>
      </div>

      <form id="form">
        <div class="scope">
          <span>Phạm vi:</span>
          <select id="scope"><option value="">Tất cả tài liệu</option></select>
          <label class="sumfull"><input type="checkbox" id="sumfull" /> Tóm tắt cả tài liệu</label>
        </div>
        <div class="chip" id="chip">
          <span>📄</span><span id="chip-name"></span>
          <button type="button" id="chip-remove" title="Bỏ file">×</button>
        </div>
        <div class="composer">
          <label class="attach" id="attach" title="Đính kèm PDF">
            📎
            <input type="file" id="file" accept="application/pdf" hidden />
          </label>
          <textarea id="q" rows="1" placeholder="Nhập câu hỏi…" required></textarea>
          <button type="submit" class="send" id="send">Gửi</button>
        </div>
      </form>
    </main>

    <aside class="detail-panel" id="source-panel">
      <div class="panel-header">
        <span class="panel-title">Nguồn tham khảo</span>
        <button id="source-toggle" class="panel-toggle" type="button" aria-label="Thu gọn panel nguồn" aria-expanded="true">−</button>
      </div>
      <div class="panel-body">
        <div class="panel-empty" id="source-empty">Câu trả lời sẽ hiển thị nguồn ở đây.</div>
        <div id="source-content"></div>
      </div>
    </aside>
  </div>

<script>
  const messages = document.getElementById("messages");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const q = document.getElementById("q");
  const send = document.getElementById("send");
  const fileInput = document.getElementById("file");
  const attach = document.getElementById("attach");
  const chip = document.getElementById("chip");
  const chipName = document.getElementById("chip-name");
  const scopeSelect = document.getElementById("scope");
  const sumfull = document.getElementById("sumfull");
  const sourceContent = document.getElementById("source-content");
  const sourceEmpty = document.getElementById("source-empty");
  const docCount = document.getElementById("doc-count");
  const statusChip = document.getElementById("status-chip");
  const sourcePanel = document.getElementById("source-panel");
  const sourceToggle = document.getElementById("source-toggle");

  const SUMMARY_RE = /tóm tắt|tóm lược|summar|mục lục|khái quát|tổng quan|tổng quát|overview|nội dung chính|ý chính|liệt kê (toàn bộ|tất cả|hết)|toàn bộ (tài liệu|nội dung)|cả (tài liệu|file|quyển|cuốn)/i;

  function setSourcePanelCollapsed(collapsed) {
    sourcePanel.classList.toggle("collapsed", collapsed);
    sourceToggle.textContent = collapsed ? "+" : "−";
    sourceToggle.setAttribute("aria-expanded", String(!collapsed));
  }
  sourceToggle.addEventListener("click", () => {
    setSourcePanelCollapsed(!sourcePanel.classList.contains("collapsed"));
  });

  function renderSourcePanel(sources, answer, query) {
    sourceContent.innerHTML = "";
    if (!sources || !sources.length) {
      sourceEmpty.textContent = answer ? "Không có nguồn cụ thể cho câu trả lời này." : "Câu trả lời sẽ hiển thị nguồn ở đây.";
      sourceEmpty.style.display = "block";
      return;
    }
    sourceEmpty.style.display = "none";
    sources.forEach((source, idx) => {
      const card = document.createElement("div");
      card.className = "source-card";
      const trimmed = String(source || "").trim();
      const summary = answer ? answer.slice(0, 180) : "Đoạn văn bản được dùng để trả lời câu hỏi hiện tại.";
      const snippet = summary.length > 180 ? summary + "…" : summary;
      card.innerHTML = `
        <div class="source-card-head">
          <span class="source-badge">#${idx + 1}</span>
          <strong>${esc(trimmed)}</strong>
        </div>
        <div class="source-card-body">
          <div class="source-label">Snippet gợi ý</div>
          <p>${esc(snippet)}</p>
        </div>
        <div class="source-card-foot">${query ? 'Từ khóa: ' + esc(query) : 'Dữ liệu được truy xuất từ kho tài liệu'}</div>
      `;
      sourceContent.appendChild(card);
    });
  }

  fetch("/api/info").then(r => r.json())
    .then(d => { document.getElementById("model").textContent = d.model; })
    .catch(() => {});

  async function refreshFiles() {
    try {
      const list = await (await fetch("/api/files")).json();
      const cur = scopeSelect.value;
      scopeSelect.innerHTML = '<option value="">Tất cả tài liệu</option>';
      for (const f of list) {
        const o = document.createElement("option");
        o.value = f.source;
        o.textContent = f.source + " (" + f.n_chunks + " đoạn)";
        scopeSelect.appendChild(o);
      }
      if ([...scopeSelect.options].some(o => o.value === cur)) scopeSelect.value = cur;
      docCount.textContent = String(list.length);
      statusChip.textContent = list.length ? "Documents ready" : "No documents";
    } catch (e) {
      docCount.textContent = "0";
      statusChip.textContent = "No documents";
    }
  }
  refreshFiles();

  const scroll = () => { messages.scrollTop = messages.scrollHeight; };

  function addRow(who, build) {
    empty.remove?.();
    const row = document.createElement("div");
    row.className = "row " + who + " wrap";
    build(row);
    messages.appendChild(row);
    scroll();
    return row;
  }

  function addBubble(who, text, cls) {
    return addRow(who, row => {
      const b = document.createElement("div");
      b.className = "bubble" + (cls ? " " + cls : "");
      b.textContent = text;
      row.appendChild(b);
    });
  }

  function addNote(text) {
    empty.remove?.();
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = text;
    messages.appendChild(n);
    scroll();
  }

  function addTyping() {
    return addRow("bot", row => {
      const b = document.createElement("div");
      b.className = "bubble status";
      b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      row.appendChild(b);
    });
  }

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (f) {
      chipName.textContent = f.name;
      chip.classList.add("show");
      attach.classList.add("has-file");
    }
  });
  document.getElementById("chip-remove").addEventListener("click", clearFile);
  function clearFile() {
    fileInput.value = "";
    chip.classList.remove("show");
    attach.classList.remove("has-file");
  }

  q.addEventListener("input", () => {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, 140) + "px";
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = q.value.trim();
    const file = fileInput.files[0];
    if (!text && !file) return;

    const wantSummary = sumfull.checked || SUMMARY_RE.test(text);

    if (file) addNote("📄 Đang nạp " + file.name + "…");
    if (text) addBubble("user", text);

    const data = new FormData();
    data.append("question", text);
    if (scopeSelect.value) data.append("source", scopeSelect.value);
    if (sumfull.checked) data.append("summarize", "1");
    if (file) data.append("file", file);

    q.value = "";
    q.style.height = "auto";
    clearFile();
    send.disabled = true;

    if (wantSummary) {
      addNote("📝 Đang tóm tắt toàn bộ tài liệu — có thể mất 30–90 giây…");
    }

    const typing = addTyping();

    try {
      const res = await fetch("/api/chat", { method: "POST", body: data });
      const d = await res.json();
      typing.remove();

      if (d.ingested) {
        addNote("✅ " + d.ingested);
        refreshFiles();
      }
      if (d.error) {
        addBubble("bot", "⚠️ " + d.error, "fallback");
        renderSourcePanel([], d.error, text);
        return;
      }
      if (d.answer == null) return;

      const row = addRow("bot", r => {
        const answerWrap = document.createElement("div");
        answerWrap.className = "answer-shell";

        const bubble = document.createElement("div");
        bubble.className = "bubble" + (d.is_fallback ? " fallback" : "");
        bubble.textContent = d.answer;

        if ((d.answer || "").length > 420) {
          bubble.classList.add("answer-collapsed");
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "answer-toggle";
          toggle.textContent = "Xem thêm";
          toggle.addEventListener("click", () => {
            const expanded = bubble.classList.toggle("expanded");
            toggle.textContent = expanded ? "Thu gọn" : "Xem thêm";
          });
          answerWrap.appendChild(bubble);
          answerWrap.appendChild(toggle);
        } else {
          answerWrap.appendChild(bubble);
        }
        r.appendChild(answerWrap);

        const meta = document.createElement("div");
        meta.className = "meta";
        const metaParts = [];
        if (d.sources && d.sources.length) {
          metaParts.push('<span class="src">Nguồn: ' + d.sources.map(esc).join("; ") + "</span>");
        }
        if (!wantSummary && d.confidence != null) {
          const confidenceClass = Number(d.confidence) < 0.7 ? "warning" : "";
          metaParts.push('<span class="meta-badge ' + confidenceClass + '">Confidence ' + Number(d.confidence).toFixed(2) + '</span>');
        }
        metaParts.push('<span class="meta-badge">' + (d.latency_s ?? 0).toFixed(1) + 's</span>');
        if (d.search_query && d.search_query.toLowerCase() !== text.toLowerCase()) {
          metaParts.push("tìm với: " + esc(d.search_query));
        }
        meta.innerHTML = metaParts.join(" · ");
        r.appendChild(meta);

        if (d.sources && d.sources.length) {
          const sourceList = document.createElement("div");
          sourceList.className = "source-list";
          d.sources.forEach(src => {
            const badge = document.createElement("span");
            badge.className = "source-pill";
            badge.textContent = src;
            sourceList.appendChild(badge);
          });
          r.appendChild(sourceList);
        }
      });
      row.classList.add("answer-row");
      renderSourcePanel(d.sources || [], d.answer, d.search_query || text);
      scroll();
    } catch (err) {
      typing.remove();
      addBubble("bot", "⚠️ Lỗi kết nối tới server.", "fallback");
      renderSourcePanel([], "Lỗi kết nối tới server.", text);
    } finally {
      send.disabled = false;
      q.focus();
    }
  });

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById("reset").addEventListener("click", async () => {
    if (!confirm("Xóa toàn bộ tài liệu đã nạp khỏi hệ thống?")) return;
    await fetch("/api/reset", { method: "POST" });
    addNote("🗑️ Đã xóa toàn bộ tài liệu.");
    refreshFiles();
    renderSourcePanel([], "", "");
  });
</script>
</body>
</html>
